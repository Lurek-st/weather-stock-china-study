# Core-open regime registry — research temporal authority for primary exposure.
#
# This is the AUTHORITATIVE research source for each market's primary core
# cash-market opening clock over the 2020-01-01..2025-12-31 analysis horizon.
# It is SEPARATE from config/v2/markets.yaml, whose static `session` block is
# legacy/current operational config only.
#
# Semantics (frozen in Stage 5B-2):
#   - primary_core_open_local = the official regular/core opening clock used for
#     broad cash-equity primary price formation (continuous trading start), NOT
#     pre-open order entry, opening-auction call start, early retail session,
#     block-deal session, extended hours, or derivative sessions.
#   - The research weather window is always [core_open - 120min, core_open).
#   - effective_from / effective_to are INCLUSIVE.
#   - A DST transition is a timezone-regime property, never a new session regime.
#
# qualification_status values: qualified_single_regime / qualified_multiple_regimes
#   / partial_evidence / unresolved.
schema_version: "2.0.0"
registry_id: "core-open-regimes"
target_horizon:
  start: "2020-01-01"
  end: "2025-12-31"
window_minutes_before: 120

markets:
  - market_id: sse_composite
    timezone: Asia/Shanghai
    regimes:
      - regime_id: sse_composite-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "09:30"
        core_close_local: "15:00"
        evidence_ids: ["sse-current-rules", "sse-2020-revision"]
        qualification_status: qualified_single_regime
        note: "09:15-09:25 is the opening call auction, not the core open"

  - market_id: szse_component
    timezone: Asia/Shanghai
    regimes:
      - regime_id: szse_component-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "09:30"
        core_close_local: "15:00"
        evidence_ids: ["szse-current-rules", "szse-2019-faq"]
        qualification_status: qualified_single_regime
        note: "09:15-09:25 is the opening call auction, not the core open"

  - market_id: topix
    timezone: Asia/Tokyo
    regimes:
      - regime_id: topix-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "09:00"
        core_close_local: "15:30"
        evidence_ids: ["jpx-current-rules", "jpx-2024-close-extension"]
        qualification_status: qualified_single_regime
        note: "Morning session open 09:00 unchanged; the 2024-11-05 change extended the CLOSE 15:00->15:30, not the open"

  - market_id: nifty50
    timezone: Asia/Kolkata
    regimes:
      - regime_id: nifty50-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "09:15"
        core_close_local: "15:30"
        evidence_ids: ["nse-current-timings", "nse-2021-timings"]
        qualification_status: qualified_single_regime
        note: "09:00-09:08 is the pre-open session; 09:15 is the normal/core market open"

  - market_id: ftse100
    timezone: Europe/London
    regimes:
      - regime_id: ftse100-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "08:00"
        core_close_local: "16:30"
        evidence_ids: ["lse-current-faq", "lse-24-main-market-unchanged"]
        qualification_status: qualified_single_regime
        note: "LSE Main Market (SETS) continuous trading 08:00; the 07:50-08:00 opening auction and the planned LSE24 overnight platform are not the core open"

  - market_id: dax
    timezone: Europe/Berlin
    regimes:
      - regime_id: dax-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "09:00"
        core_close_local: "17:30"
        evidence_ids: ["db-current-trading-hours", "xetra-2021-calendar"]
        qualification_status: qualified_single_regime
        note: "Xetra core trading 09:00-17:30 CET; the 08:00 Extended Xetra Retail Service (early trading) is NOT the core open"

  - market_id: sp500
    timezone: America/New_York
    regimes:
      - regime_id: sp500-2020-2025
        effective_from: "2020-01-01"
        effective_to: "2025-12-31"
        core_open_local: "09:30"
        core_close_local: "16:00"
        evidence_ids: ["nyse-hours-calendars", "sec-34-93819", "fr-2022-06383"]
        qualification_status: qualified_single_regime
        note: "Qualified in Stage 5B-1 (New York DST canary); pre-opening 06:30 and early 07:00 sessions are not the core open"

  - market_id: bse50
    timezone: Asia/Shanghai
    regimes:
      - regime_id: bse50-2021-2025
        effective_from: "2021-11-15"
        effective_to: "2025-12-31"
        core_open_local: "09:30"
        core_close_local: "15:00"
        evidence_ids: ["bse-launch-2021", "bse-rules-trial"]
        qualification_status: qualified_single_regime
        note: "Beijing Stock Exchange opened 2021-11-15; effective_from reflects the exchange effective date, not index sample start"

# taiex is retained as the already-qualified engineering/reference market; it is
# NOT part of the Stage 5B-2 new-qualification burden (qualification_status
# reference only, no horizon regimes needed here).
reference_market:
  market_id: taiex
  timezone: Asia/Taipei
  core_open_local: "09:00"
  role: already_qualified_engineering_reference

