name: Validate weather-market repository

on:
  push:
    paths:
      - "data/raw/**/*.json"
      - "data/audits/**/*.json"
      - "inbox/**/*.md"
      - "schemas/**"
      - "config/v2/**"
      - "docs/v2/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "data/raw/**/*.json"
      - "data/audits/**/*.json"
      - "inbox/**/*.md"
      - "schemas/**"
      - "config/v2/**"
      - "docs/v2/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Validate V2 registries without production credentials
        run: python scripts/v2/check_source_readiness.py
      - name: Validate canonical records when present
        shell: bash
        run: |
          files=$(find data/raw -name '*.json' -type f)
          if [ -n "$files" ]; then
            python scripts/validate_records.py data/raw
          else
            echo "No canonical records yet"
          fi
